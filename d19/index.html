<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#86a9a7">
<title>다이아몬드 시험 19</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#86a9a7; color:#f6f2ec; overflow:hidden;
    font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Georgia,serif;
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hint { position:fixed; left:0; right:0; bottom:calc(9vh + env(safe-area-inset-bottom)); text-align:center;
    font-size:13px; letter-spacing:.42em; text-indent:.42em; opacity:0; transition:opacity 1.2s ease; pointer-events:none;
    text-shadow:0 0 12px rgba(40,55,52,.5); }
  #hint.on { opacity:.85; }
  #vw { position:fixed; inset:0; z-index:20; background:rgba(10,12,12,.97); opacity:0; pointer-events:none; transition:opacity .28s ease; touch-action:none; overflow:hidden; }
  #vw.on { opacity:1; pointer-events:auto; }
  #vtrack { position:absolute; inset:0; will-change:transform; }
  .vs { position:absolute; top:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .vs img { max-width:100%; max-height:100%; will-change:transform; -webkit-user-drag:none; pointer-events:none; }
  #vtrack.vin { animation:vin .95s cubic-bezier(.2,.7,.15,1) both; }
  @keyframes vin { from { filter:blur(16px) brightness(1.9) saturate(.6); } 55% { filter:blur(2px) brightness(1.15) saturate(.95); } to { filter:none; } }
  #vg { position:absolute; inset:-30%; pointer-events:none; opacity:0; mix-blend-mode:screen;
    background:linear-gradient(112deg, rgba(255,255,255,0) 42%, rgba(255,246,236,.75) 49%, rgba(214,236,255,.5) 51.5%, rgba(255,255,255,0) 58%); }
  #vg.go { animation:vgl 1.05s ease-out both; }
  @keyframes vgl { from { transform:translateX(-70%); opacity:1; } to { transform:translateX(70%); opacity:0; } }
  #vx { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:10px; width:48px; height:48px; border:0; background:none; color:#fff; font:200 32px/48px -apple-system,sans-serif; opacity:.85; z-index:2; }
  #vn { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font:12px -apple-system,sans-serif; letter-spacing:.2em; opacity:.7; pointer-events:none; }
  #msg { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; text-align:center; font:12px -apple-system,sans-serif; opacity:.8; pointer-events:none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">화면을 눌러 축하해주세요</div>
<div id="msg"></div>
<div id="vw"><div id="vtrack"></div><div id="vg"></div><button id="vx" aria-label="닫기">×</button><div id="vn"></div></div>
<script>
(function () {
'use strict';
var PHOTOS = ['p/1.jpg','p/2.jpg','p/3.jpg','p/4.jpg','p/5.jpg','p/6.jpg','p/7.jpg','p/8.jpg','p/9.jpg']; // 0 = 가운데 큰 면
var FOCUS = [[.50,.31],[.48,.33],[.62,.31],[.42,.33],[.50,.44],[.50,.30],[.48,.30],[.50,.30],[.52,.28]]; // 사진마다 면 가운데에 올 자리(얼굴 쪽)
var ZOOM = [1,1.15,1,1,1,1,1,1,1];

var cv = document.getElementById('cv'), hint = document.getElementById('hint'), msg = document.getElementById('msg');
var gl = cv.getContext('webgl', { alpha:false, antialias:false, powerPreference:'high-performance' });
if (!gl) { msg.textContent = '이 브라우저에서는 화면을 그릴 수 없어요'; return; }
var Q = new URLSearchParams(location.search);
var FONT = (Q.get('font') || 'Pinyon Script').replace(/[^A-Za-z ]/g, '');
(function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=' + FONT.replace(/ /g, '+') + '&display=swap'; document.head.appendChild(l); })();
if (Q.get('frame')) { cv.style.cssText = 'left:50%;right:auto;width:calc(100vh*0.462);transform:translateX(-50%)'; document.body.style.background = '#222'; }

/* ───────── 벡터 도구 ───────── */
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
function mul(A, B) { var C = []; for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) C[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c]; return C; } // 행 우선
function app(M, v) { return [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]]; }
function rotY(a) { var c = Math.cos(a), s = Math.sin(a); return [c, 0, -s, 0, 1, 0, s, 0, c]; }
function rotX(a) { var c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; }
function rotAxis(k, a) { var c = Math.cos(a), s = Math.sin(a), t = 1 - c, x = k[0], y = k[1], z = k[2];
  return [t * x * x + c, t * x * y - s * z, t * x * z + s * y, t * x * y + s * z, t * y * y + c, t * y * z - s * x, t * x * z - s * y, t * y * z + s * x, t * z * z + c]; }
function sm(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }

/* ═════════ 1. 라운드 브릴리언트 컷 — 면 73개를 평면으로 ═════════ */
var D2R = Math.PI / 180, GT = 0.045, TABLE = 0.37, CA = 31 * D2R, PA = 40.75 * D2R;
var yG = GT / 2, yT = yG + (1 - TABLE) * Math.tan(CA), yC = -yG - Math.tan(PA);
function pol(r, deg, y) { return [r * Math.cos(deg * D2R), y, r * Math.sin(deg * D2R)]; }
var planes = [];
function addN(n, p) { planes.push([n[0], n[1], n[2], dot(n, p)]); }
function add3(a, b, c) { var n = norm(cross(sub(b, a), sub(c, a))); if (dot(n, sub(a, [0, -0.2, 0])) < 0) n = [-n[0], -n[1], -n[2]]; addN(n, a); }
addN([0, 1, 0], [0, yT, 0]);                                                         // 0 테이블
var k, sC = Math.sin(CA), cC = Math.cos(CA), hK = sC + cC * yG;
for (k = 0; k < 8; k++) addN([sC * Math.cos(45 * k * D2R), cC, sC * Math.sin(45 * k * D2R)], pol(1, 45 * k, yG)); // 1~8 큰 마름모 면
var rS = TABLE * Math.cos(22.5 * D2R); rS = rS + 0.5 * (1 - rS);
var yS = (hK - sC * rS * Math.cos(22.5 * D2R)) / cC;
for (k = 0; k < 8; k++) add3(pol(TABLE, 45 * k, yT), pol(TABLE, 45 * k + 45, yT), pol(rS, 45 * k + 22.5, yS)); // 별 면
for (k = 0; k < 8; k++) { var Sp = pol(rS, 45 * k + 22.5, yS), Mp = pol(1, 45 * k + 22.5, yG);
  add3(Sp, pol(1, 45 * k, yG), Mp); add3(Sp, Mp, pol(1, 45 * k + 45, yG)); }          // 윗 거들 면
for (k = 0; k < 16; k++) { var a = (11.25 + 22.5 * k) * D2R; planes.push([Math.cos(a), 0, Math.sin(a), Math.cos(11.25 * D2R)]); } // 거들 띠
var sP = Math.sin(PA), cP = Math.cos(PA);
for (k = 0; k < 8; k++) addN([sP * Math.cos(45 * k * D2R), -cP, sP * Math.sin(45 * k * D2R)], [0, yC, 0]); // 아래 큰 면
var rL = 0.23, yL = yC + rL * Math.cos(22.5 * D2R) * Math.tan(PA);
for (k = 0; k < 8; k++) { var Lp = pol(rL, 45 * k + 22.5, yL), Mb = pol(1, 45 * k + 22.5, -yG);
  add3(pol(1, 45 * k, -yG), Mb, Lp); add3(Mb, pol(1, 45 * k + 45, -yG), Lp); }      // 아래 거들 면
var NP = planes.length; // 73

/* 사진이 놓이는 면 9개 (테이블 + 큰 마름모 8) */
var rK = 0.685, yK = (hK - sC * rK) / cC;
var fcenter = [[0, yT, 0]], fsize = [[0.80, 1.20]], fext = [[.385, .385]];
for (k = 0; k < 8; k++) { fcenter.push(pol(rK, 45 * k, yK)); fsize.push([0.62, 0.93]); fext.push([.265, .385]); }
var uFC = new Float32Array(27), uFU = new Float32Array(27), uFV = new Float32Array(27), uFO = new Float32Array(18);
function setAxes(psi) { // 다 열렸을 때 사진이 화면에서 똑바로 서도록
  var Ry = rotY(psi), RyT = rotY(-psi);
  for (var i = 0; i < 9; i++) { var n = planes[i], nS = app(Ry, n), up = [0, 0, -1], d = dot(up, nS);
    var vS = norm([up[0] - d * nS[0], up[1] - d * nS[1], up[2] - d * nS[2]]), uS = cross(vS, nS), u = app(RyT, uS), v = app(RyT, vS);
    var f = FOCUS[i] || [.5, .5], z = Math.max(1, fext[i][0] / fsize[i][0] / Math.min(f[0], 1 - f[0]), fext[i][1] / fsize[i][1] / Math.min(f[1], 1 - f[1])) * 1.24 * (ZOOM[i] || 1);
    uFO[i * 2] = f[0]; uFO[i * 2 + 1] = f[1];
    for (var c = 0; c < 3; c++) { uFC[i * 3 + c] = fcenter[i][c]; uFU[i * 3 + c] = u[c] / fsize[i][0] / z; uFV[i * 3 + c] = v[c] / fsize[i][1] / z; } }
}
setAxes(0);

/* ═════════ 2. 셰이더 ═════════ */
function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); msg.textContent = '셰이더 오류'; } return s; }
function prog(vs, fs) { var p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return { p:p, a:gl.getAttribLocation(p, 'aP'), u:function (n) { return gl.getUniformLocation(p, n); } }; }
var VS = 'attribute vec2 aP; varying vec2 vU; void main(){ vU=aP*0.5+0.5; gl_Position=vec4(aP,0.0,1.0); }';
var HASH = 'float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }\n';

var SCENE = prog(VS, [
'precision highp float;',
'varying vec2 vU; uniform float uA,uTan,uRsv,uSpark,uTime,uGain,uMetal,uHistW; uniform vec2 uJit; uniform sampler2D uHist; uniform vec3 uCam; uniform mat3 uR; uniform vec4 uGem;',
'uniform vec3 uCa[24]; uniform sampler2D uDepth; uniform vec3 uFocC,uFocU,uFocV,uFocO; uniform float uReflW,uMaxB; uniform vec2 uLr; uniform vec3 uLw; uniform float uPlY,uPxS,uShad,uMA; uniform sampler2D uProj; uniform vec4 uPj; uniform vec4 uPl[73]; uniform vec3 uFC[9]; uniform vec3 uFU[9]; uniform vec3 uFV[9]; uniform vec2 uFO[9]; uniform sampler2D uSharp,uSoft;',
'const float F0=0.172;', HASH,
'float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y); }',
'float fbm(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*vn(p); p=p*2.03+7.1; a*=0.5; } return s; }',
'vec3 backdrop(vec2 s){',                                                     // 연한 청회색 종이 바탕
'  vec2 q=(s-uGem.xy)/max(uGem.z,0.001); float fx=uGem.w;',
'  vec2 a=s-vec2(-0.08,0.10); float l1=exp(-dot(a,a)*0.55);',
'  vec3 c=mix(vec3(0.33,0.47,0.48),vec3(0.64,0.785,0.78),l1);',
'  vec2 b=s-vec2(0.50,-0.75); c+=vec3(0.05,0.03,0.035)*exp(-dot(b,b)*1.2);',
'  float n=fbm(s*1.6+3.0);',
'  c*=0.95+0.10*n;',
'  vec2 pv=(s-uPj.xy)/uPj.zw; ',
'  float bxp=smoothstep(1.02,0.80,abs(pv.x)); float byp=smoothstep(0.36,0.22,abs(pv.y-0.47)); float pool=bxp*byp;',
'  float hot=exp(-(pv.x*pv.x*1.1+(pv.y-0.47)*(pv.y-0.47)*9.0));',
'  if(abs(pv.x)<1.0 && abs(pv.y)<1.0){ vec2 pj=vec2(pv.x*0.5+0.5,0.5-pv.y*0.5); vec2 ca=vec2(0.0035,0.0)*(0.4+abs(pv.x));',
'    vec3 tx=vec3(texture2D(uProj,pj+ca).r,texture2D(uProj,pj).r,texture2D(uProj,pj-ca).r);',
'    float fl=0.93+0.07*sin(uTime*13.0)*sin(uTime*5.3);',
'    c+=(vec3(1.0,0.97,0.90)*tx*(0.50+0.16*n)*(0.55+0.45*hot)+vec3(0.050,0.052,0.050)*pool*(0.6+0.4*hot))*uGem.w*fl; }',
'  return c; }',
'vec3 env(vec3 d,float sp){ d.xz=vec2(d.x*uLr.x-d.z*uLr.y,d.x*uLr.y+d.z*uLr.x);',                                                         // 보석이 비추는 조명(밝고 크림빛, 잔 빛점 많이)
'  float y=d.y; vec3 c=mix(vec3(0.15,0.18,0.19),vec3(0.84,0.89,0.87),smoothstep(-0.55,0.60,y));',
'  float az=atan(d.z,d.x);',
'  float ring=smoothstep(0.26,0.44,y)*smoothstep(0.95,0.80,y);',
'  c+=vec3(1.15,1.10,1.02)*ring*(0.28+0.72*smoothstep(0.0,0.6,sin(az*3.0+0.6)));',
'  c*=1.0-0.72*smoothstep(0.92,0.99,y);',
'  c+=vec3(1.9,1.15,1.45)*smoothstep(0.78,0.94,dot(d,vec3(0.72,0.62,-0.31)));',   // 크고 부드러운 분홍 빛
'  c+=vec3(4.6,4.3,4.0)*smoothstep(0.988,0.997,dot(d,vec3(0.40,0.74,-0.54)));',
'  c+=vec3(4.8,3.6,2.9)*smoothstep(0.990,0.998,dot(d,vec3(-0.62,0.62,0.48)));',
'  c+=vec3(4.2,3.0,3.5)*smoothstep(0.985,0.996,dot(d,vec3(0.10,0.55,0.83)));',
'  c+=vec3(3.4,3.6,4.0)*smoothstep(0.992,0.999,dot(d,vec3(-0.50,0.80,-0.33)));',
'  c+=vec3(1.6,1.5,1.4)*smoothstep(0.93,0.975,dot(d,vec3(-0.80,0.25,-0.54)));',
'  vec2 g0=d.xz/(1.0+abs(d.y)); float sg=d.y>0.0?3.0:19.0;',
'  vec2 g=g0*6.5; float h=hash(floor(g)+sg); vec2 f=fract(g)-0.5-(vec2(fract(h*13.7),fract(h*29.3))-0.5)*0.6;',
'  c+=step(0.70,h)*smoothstep(0.13,0.03,length(f))*mix(vec3(7.0,6.6,6.2),vec3(7.5,4.8,4.0),step(0.6,fract(h*7.1)))*uSpark*sp;',
'  g=g0*15.0+7.3; h=hash(floor(g)+sg+5.0); f=fract(g)-0.5-(vec2(fract(h*11.3),fract(h*23.9))-0.5)*0.6;',
'  vec3 tn=mix(vec3(9.0,8.6,8.0),mix(vec3(9.5,6.0,5.0),vec3(8.5,5.5,7.5),step(0.5,fract(h*5.3))),step(0.55,fract(h*3.7)));',
'  c+=step(0.58,h)*smoothstep(0.16,0.04,length(f))*tn*uSpark*sp;',
'  return c; }',
'float seg(vec3 p,vec3 a,vec3 b){ vec3 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h); }',
'float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }',
'float seg2(vec2 p,vec2 a,vec2 b){ vec2 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h); }',
'float sdRing(vec3 p){',
'  vec3 q=p-vec3(0.0,-3.62,0.0); float rho=length(q.xy)-2.42; float up=clamp((q.y-0.9)/1.5,0.0,1.0); up=up*up*(3.0-2.0*up);',
'  float hw=mix(0.215,0.105,up); float ho=mix(0.150,0.205,up); float hi=mix(0.085,0.105,up);',
'  float kn=(abs(q.z)*ho+rho*hw-hw*ho)/length(vec2(ho,hw));',
'  float band=max(max(kn,-rho-hi),abs(q.z)-hw)-0.022;',
'  float a=atan(p.z,p.x)+0.5236; float r=length(p.xz); float aa=mod(a+0.5236,1.0472)-0.5236;',
'  vec3 m=vec3(r*cos(aa),p.y,r*sin(aa));',
'  float dl=min(seg2(m.xy,vec2(0.17,-1.04),vec2(0.56,-0.66)),min(seg2(m.xy,vec2(0.56,-0.66),vec2(1.035,-0.10)),seg2(m.xy,vec2(1.035,-0.10),vec2(1.05,0.07))));',
'  float tw=mix(0.135,0.058,clamp(m.y+1.0,0.0,1.0));',
'  float pr=length(max(vec2(dl-0.034,abs(m.z)-tw),0.0))-0.024;',                      // 아래가 넓고 위로 좁아지는 납작한 발
'  pr=smin(pr,seg(m,vec3(1.05,0.07,0.0),vec3(0.875,0.172,0.0))-0.060,0.035);',         // 윗면을 무는 둥근 발톱
'  float rc=0.17+(p.y+1.04)*1.03; float yt=-0.93+0.34*pow(abs(cos(aa*3.0)),3.0);',
'  float cup=max(max(abs(r-rc)-0.030,p.y-yt),-1.06-p.y);',                             // 발 사이 U자로 파인 컵
'  float bead=length(vec2(r-0.20,p.y+1.07))-0.062;',
'  float base=length((p-vec3(0.0,-1.16,0.0))*vec3(1.0,1.5,1.0))-0.24;',
'  return min(smin(smin(pr,cup,0.04),bead,0.03),smin(base,band,0.26)); }',
'float sdGemA(vec3 p){ float r=length(p.xz); return max(max(0.6528*r-0.7576*p.y-0.6699,0.5150*r+0.8572*p.y-0.5343),p.y-0.4011); }',
'void main(){',
'  vec2 s=vU*2.0-1.0+uJit; s.x*=uA;',
'  vec3 col=backdrop(s); float am=0.0;',
'  vec3 dw=normalize(vec3(s.x*uTan,-1.0,-s.y*uTan));',
'  vec3 o=uCam*uR; vec3 d=dw*uR;',
'  if(uShad>0.5){ float tp=(uCam.y-uPlY)/max(0.2,-dw.y); vec3 so=(uCam+dw*tp)*uR; vec3 sl=uLw*uR;',
'    vec3 oc2=so-vec3(0.0,-2.5,0.0); float b2=dot(oc2,sl); float d2=b2*b2-(dot(oc2,oc2)-14.5);',
'    if(d2>0.0){ float sq2=sqrt(d2); float t=max(-b2-sq2,0.05); float te=-b2+sq2; float res=1.0;',
'      for(int i=0;i<22;i++){ vec3 qq=so+sl*t; float h=min(sdRing(qq),sdGemA(qq)+0.05); res=min(res,5.0*h/t); if(h<0.003){ res=0.0; break; } t+=clamp(h*0.85,0.05,0.50); if(t>te) break; }',

'  float tN=-1e9,tN2=-1e9,tF=1e9; vec3 nN=vec3(0.0,1.0,0.0); vec3 nN2=vec3(0.0,1.0,0.0); float fi=-1.0; bool hitG=false;',
